name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Build-time Supabase env. Dummy values are NOT enough: /najam/[slug]
      # static generation intentionally fails loudly when the DB is
      # unreachable, so the build step below only runs when the real URL is
      # configured as a repo secret.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx next lint --max-warnings 0

      - name: Test
        run: npx vitest run

      - name: Build
        # Skipped when Supabase secrets are not configured — ISR pages fetch
        # from Supabase during `next build` and category pages fail the export
        # on an unreachable database (verified with dummy env values).
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        run: npx next build
