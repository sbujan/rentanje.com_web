name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      # Re-run when this file changes, so a fix to the pipeline applies any
      # migration that a previous failed run left pending.
      - ".github/workflows/supabase-migrations.yml"
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      # Pinned on purpose. `latest` picked up CLI v3.0.0 the day it shipped
      # (2026-11-02), where a bare `db push` targets the local stack and refuses
      # to run unattended without --yes, so production migrations silently
      # stopped applying. Upgrade deliberately; v3 needs `db push --remote --yes`.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.95.4

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push pending migrations
        run: supabase db push
